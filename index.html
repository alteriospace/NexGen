    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://qbeecugbswhwjknwmqxj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_CYuWw1D0T3uNJ0C1F9IABg_uQJStCep';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== GLOBAL STATE ====================
        let myWallets = [];
        let allTransactions = [];
        let filteredTransactions = [];
        let categories = [];
        let categoryMap = {};
        let walletMap = {};
        let barChart = null;
        let pieChart = null;
        let selectedFile = null;

        function formatRp(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const slider = document.getElementById('theme-slider');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark');
                slider.style.transform = 'translateX(32px)';
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                slider.style.transform = 'translateX(0)';
            }
        }

        function switchPage(pageId) {
            updateActiveNav(pageId);
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const page = document.getElementById('page-' + pageId);
            if (page) page.classList.add('active');

            const titles = {
                dashboard: { title: 'Dashboard Overview', sub: 'Your current financial summary and activity' },
                report:    { title: 'Analytics', sub: 'Monthly performance & category breakdown' },
                transaction:{ title: 'Transactions', sub: 'Complete history of your financial activity' },
                wallet:    { title: 'Portfolio & Wallets', sub: 'Manage all your connected accounts' }
            };
            if (titles[pageId]) {
                document.getElementById('header-title').innerText = titles[pageId].title;
                document.getElementById('header-subtitle').innerText = titles[pageId].sub;
            }

            requestAnimationFrame(() => {
                document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
                if (pageId === 'report') setTimeout(() => { loadChartData(); loadPieChart(); }, 80);
            });
        }

        function updateActiveNav(pageId) {
            const deskContainer = document.getElementById('desktop-nav-container');
            const deskSlider = document.getElementById('nav-slider');
            const deskBtn = document.getElementById('nav-' + pageId);

            if (deskContainer && deskSlider && deskBtn) {
                deskContainer.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                deskBtn.classList.add('active');
                const cRect = deskContainer.getBoundingClientRect();
                const bRect = deskBtn.getBoundingClientRect();
                deskSlider.style.left = `${bRect.left - cRect.left}px`;
                deskSlider.style.width = `${bRect.width}px`;
            }

            const mobContainer = document.getElementById('mobile-nav-container');
            const mobSlider = document.getElementById('mobile-slider');
            const mobBtn = document.getElementById('nav-mob-' + pageId);

            if (mobContainer && mobSlider && mobBtn) {
                mobContainer.querySelectorAll('.nav-mob-btn').forEach(b => b.classList.remove('active'));
                mobBtn.classList.add('active');
                const cRect = mobContainer.getBoundingClientRect();
                const bRect = mobBtn.getBoundingClientRect();
                mobSlider.style.left = `${bRect.left - cRect.left}px`;
            }
        }

        // ==================== DATA FETCHING ====================
        async function fetchWallets() {
            const { data, error } = await db.from('wallets').select('*').order('created_at');
            if (error) { console.error(error); return []; }
            return data || [];
        }

        async function fetchCategories() {
            const { data, error } = await db.from('categories').select('*').order('type');
            if (error) { console.error(error); return []; }
            return data || [];
        }

        async function fetchTransactions() {
            const { data, error } = await db
                .from('transactions')
                .select(`*, wallets(name), categories(name, type)`)
                .order('transaction_date', { ascending: false });
            if (error) { console.error(error); return []; }
            return data || [];
        }

        async function loadData() {
            try {
                const [walletsData, categoriesData, transactionsData] = await Promise.all([
                    fetchWallets(), fetchCategories(), fetchTransactions()
                ]);

                myWallets = walletsData;
                categories = categoriesData;
                allTransactions = transactionsData;
                filteredTransactions = transactionsData;

                categoryMap = {};
                categories.forEach(c => categoryMap[c.id] = c.name);

                walletMap = {};
                myWallets.forEach(w => walletMap[w.id] = w.name);

                renderWalletsHTML();
                renderTransactionsTable(filteredTransactions);
                renderRecentTransactions();
                await calculateTotals();

            } catch (err) {
                console.error(err);
                alert('Gagal memuat data dari Supabase');
            }
        }

        async function calculateTotals() {
            let totalIncome = 0, totalExpense = 0;
            allTransactions.forEach(t => {
                if (t.type === 'income') totalIncome += Number(t.amount);
                else totalExpense += Number(t.amount);
            });
            const totalBalance = myWallets.reduce((sum, w) => sum + Number(w.balance), 0);
            document.getElementById('dash-balance').innerText = formatRp(totalBalance);
            document.getElementById('dash-income').innerText = formatRp(totalIncome);
            document.getElementById('dash-expense').innerText = formatRp(totalExpense);
        }

        function renderWalletsHTML() {
            const dash = document.getElementById('dash-wallet-list');
            const grid = document.getElementById('full-wallet-grid');
            dash.innerHTML = '';
            grid.innerHTML = '';

            myWallets.forEach(w => {
                dash.innerHTML += `
                    <div class="flex justify-between p-3 border rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl ${w.bg || 'bg-gray-100'} ${w.color || ''} flex items-center justify-center">
                                <i class="fa-solid ${w.icon || 'fa-wallet'}"></i>
                            </div>
                            <span class="font-semibold">${w.name}</span>
                        </div>
                        <span class="font-bold">${formatRp(w.balance)}</span>
                    </div>
                `;
                grid.innerHTML += `
                    <div class="p-6 border rounded-3xl">
                        <div class="w-11 h-11 rounded-2xl ${w.bg || 'bg-gray-100'} ${w.color || ''} flex items-center justify-center mb-4">
                            <i class="fa-solid ${w.icon || 'fa-wallet'} text-xl"></i>
                        </div>
                        <p class="text-sm text-gray-500">${w.name}</p>
                        <p class="text-2xl font-extrabold mt-1">${formatRp(w.balance)}</p>
                    </div>
                `;
            });
        }

        function renderRecentTransactions() {
            const container = document.getElementById('dash-trx-list');
            container.innerHTML = '';
            const recent = allTransactions.slice(0, 5);
            if (recent.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 px-2">No transactions yet.</p>`;
                return;
            }
            recent.forEach(t => {
                const sign = t.type === 'income' ? '+' : '-';
                const catName = t.categories?.name || categoryMap[t.category_id] || 'Uncategorized';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-3 border rounded-2xl">
                        <div>
                            <p class="font-medium">${catName}</p>
                            <p class="text-xs text-gray-500">${new Date(t.transaction_date).toLocaleDateString('id-ID')}</p>
                        </div>
                        <span class="font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}">${sign}${formatRp(t.amount)}</span>
                    </div>
                `;
            });
        }

        function renderTransactionsTable(data) {
            const tbody = document.getElementById('full-trx-list');
            tbody.innerHTML = '';

            data.forEach(t => {
                const sign = t.type === 'income' ? '+' : '-';
                const catName = t.categories?.name || categoryMap[t.category_id] || 'Uncategorized';
                const walletName = t.wallets?.name || walletMap[t.wallet_id] || '-';
                const hasProof = t.attachment_url ? `<a href="${t.attachment_url}" target="_blank" class="text-blue-500"><i class="fa-solid fa-image"></i></a>` : '';

                tbody.innerHTML += `
                    <tr class="trx-row border-b">
                        <td class="p-4">${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td>
                        <td class="p-4">${catName}</td>
                        <td class="p-4 text-sm text-gray-500">${walletName}</td>
                        <td class="p-4 text-center">${hasProof}</td>
                        <td class="p-4 text-right font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-red-600'}">
                            ${sign} ${formatRp(t.amount)}
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="editTransaction('${t.id}')" class="text-blue-500 hover:text-blue-700 mx-1"><i class="fa-solid fa-edit"></i></button>
                            <button onclick="deleteTransaction('${t.id}')" class="text-red-500 hover:text-red-700 mx-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // ==================== FILTER & SEARCH ====================
        function applyFilters() {
            const startDate = document.getElementById('filter-start-date').value;
            const endDate = document.getElementById('filter-end-date').value;
            const type = document.getElementById('filter-type').value;

            filteredTransactions = allTransactions.filter(t => {
                let match = true;
                if (startDate && t.transaction_date < startDate) match = false;
                if (endDate && t.transaction_date > endDate) match = false;
                if (type && t.type !== type) match = false;
                return match;
            });
            renderTransactionsTable(filteredTransactions);
        }

        function resetFilters() {
            document.getElementById('filter-start-date').value = '';
            document.getElementById('filter-end-date').value = '';
            document.getElementById('filter-type').value = '';
            filteredTransactions = allTransactions;
            renderTransactionsTable(filteredTransactions);
        }

        function setupSearch() {
            const input = document.getElementById('search-trx');
            input.addEventListener('input', () => {
                const kw = input.value.toLowerCase();
                const result = filteredTransactions.filter(t => {
                    const catName = (t.categories?.name || categoryMap[t.category_id] || '').toLowerCase();
                    return catName.includes(kw);
                });
                renderTransactionsTable(result);
            });
        }

        // ==================== CHARTS ====================
        async function loadChartData() {
            if (barChart) barChart.destroy();

            const monthly = {};
            allTransactions.forEach(t => {
                const date = new Date(t.transaction_date);
                const monthKey = date.toLocaleString('default', { month: 'short' }) + ' ' + date.getFullYear();
                if (!monthly[monthKey]) monthly[monthKey] = { income: 0, expense: 0 };
                if (t.type === 'income') monthly[monthKey].income += Number(t.amount);
                else monthly[monthKey].expense += Number(t.amount);
            });

            const labels = Object.keys(monthly);
            const ctx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Income', data: labels.map(l => monthly[l].income), backgroundColor: '#2563EB' },
                        { label: 'Expense', data: labels.map(l => monthly[l].expense), backgroundColor: '#ef4444' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        async function loadPieChart() {
            if (pieChart) pieChart.destroy();

            const expenseByCategory = {};
            allTransactions.forEach(t => {
                if (t.type === 'expense') {
                    const catName = t.categories?.name || categoryMap[t.category_id] || 'Other';
                    expenseByCategory[catName] = (expenseByCategory[catName] || 0) + Number(t.amount);
                }
            });

            const labels = Object.keys(expenseByCategory);
            const data = Object.values(expenseByCategory);
            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];

            const ctx = document.getElementById('pieChart').getContext('2d');
            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // ==================== IMAGE UPLOAD ====================
        async function uploadReceipt(file) {
            if (!file) return null;

            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;
            const filePath = `receipts/${fileName}`;

            const { data, error } = await db.storage
                .from('receipts')
                .upload(filePath, file);

            if (error) {
                console.error('Upload error:', error);
                alert('Gagal upload bukti transaksi');
                return null;
            }

            const { data: urlData } = db.storage.from('receipts').getPublicUrl(filePath);
            return urlData.publicUrl;
        }

        // ==================== ADD / EDIT TRANSACTION ====================
        let currentEditId = null;

        async function openAddTransactionModal(editData = null) {
            currentEditId = editData ? editData.id : null;
            selectedFile = null;

            const modalHTML = `
                <div id="addTrxModal" class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center z-[60]">
                    <div class="bg-white dark:bg-brand-surface w-full md:w-[440px] rounded-t-3xl md:rounded-3xl p-6 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-5">
                            <h3 class="text-xl font-bold">${currentEditId ? 'Edit Transaction' : 'Add Transaction'}</h3>
                            <button onclick="closeAddTransactionModal()" class="text-2xl leading-none">&times;</button>
                        </div>

                        <form id="addTrxForm">
                            <!-- Type -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Type</label>
                                <div class="flex gap-2">
                                    <label class="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="expense" ${!editData || editData.type === 'expense' ? 'checked' : ''} class="peer hidden" onchange="updateCategoryOptions()">
                                        <div class="peer-checked:bg-red-500 peer-checked:text-white border border-red-200 text-red-600 rounded-2xl py-2 text-center text-sm font-semibold">Expense</div>
                                    </label>
                                    <label class="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="income" ${editData?.type === 'income' ? 'checked' : ''} class="peer hidden" onchange="updateCategoryOptions()">
                                        <div class="peer-checked:bg-emerald-500 peer-checked:text-white border border-emerald-200 text-emerald-600 rounded-2xl py-2 text-center text-sm font-semibold">Income</div>
                                    </label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Wallet</label>
                                <select id="trxWallet" class="w-full border rounded-2xl px-4 py-2.5 text-sm" required></select>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Category</label>
                                <select id="trxCategory" class="w-full border rounded-2xl px-4 py-2.5 text-sm" required></select>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="mb-4">
                                    <label class="block text-sm font-medium mb-1.5">Amount</label>
                                    <input type="number" id="trxAmount" class="w-full border rounded-2xl px-4 py-2.5 text-sm" value="${editData?.amount || ''}" required>
                                </div>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium mb-1.5">Date</label>
                                    <input type="date" id="trxDate" class="w-full border rounded-2xl px-4 py-2.5 text-sm" value="${editData?.transaction_date || new Date().toISOString().split('T')[0]}" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Notes</label>
                                <textarea id="trxNotes" class="w-full border rounded-2xl px-4 py-2.5 text-sm" rows="2">${editData?.notes || ''}</textarea>
                            </div>

                            <!-- Proof Upload -->
                            <div class="mb-5">
                                <label class="block text-sm font-medium mb-1.5">Proof / Receipt (Optional)</label>
                                <input type="file" id="trxProof" accept="image/*" class="w-full text-sm border rounded-2xl p-2" onchange="handleFileSelect(event)">
                                <div id="proofPreview" class="mt-2"></div>
                                ${editData?.attachment_url ? `<p class="text-xs text-gray-500 mt-1">Current: <a href="${editData.attachment_url}" target="_blank" class="text-blue-500">View current proof</a></p>` : ''}
                            </div>

                            <button type="button" onclick="submitTransaction()" class="w-full bg-brand-blue hover:bg-blue-700 text-white py-3 rounded-2xl font-semibold">
                                ${currentEditId ? 'Update Transaction' : 'Save Transaction'}
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
            await populateWalletDropdown(editData?.wallet_id);
            await populateCategoryDropdown(editData?.type || 'expense', editData?.category_id);

            // Show existing proof preview if editing
            if (editData?.attachment_url) {
                document.getElementById('proofPreview').innerHTML = `
                    <img src="${editData.attachment_url}" class="preview-image mt-2 border">
                `;
            }
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('proofPreview').innerHTML = `
                        <img src="${e.target.result}" class="preview-image mt-2 border">
                        <p class="text-xs text-gray-500 mt-1">${selectedFile.name}</p>
                    `;
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        function closeAddTransactionModal() {
            const modal = document.getElementById('addTrxModal');
            if (modal) modal.remove();
            currentEditId = null;
            selectedFile = null;
        }

        async function populateWalletDropdown(selectedId = null) {
            const select = document.getElementById('trxWallet');
            select.innerHTML = '<option value="">-- Pilih Wallet --</option>';
            myWallets.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.id;
                opt.textContent = `${w.name} (${formatRp(w.balance)})`;
                if (selectedId && w.id === selectedId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        async function populateCategoryDropdown(type, selectedId = null) {
            const select = document.getElementById('trxCategory');
            select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            const filtered = categories.filter(c => c.type === type);
            filtered.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                if (selectedId && cat.id === selectedId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function updateCategoryOptions() {
            const type = document.querySelector('input[name="type"]:checked').value;
            populateCategoryDropdown(type);
        }

        async function submitTransaction() {
            const type = document.querySelector('input[name="type"]:checked').value;
            const walletId = document.getElementById('trxWallet').value;
            const categoryId = document.getElementById('trxCategory').value;
            const amount = parseFloat(document.getElementById('trxAmount').value);
            const date = document.getElementById('trxDate').value;
            const notes = document.getElementById('trxNotes').value;

            if (!walletId || !categoryId || !amount) {
                alert('Please fill Wallet, Category and Amount');
                return;
            }

            try {
                let attachmentUrl = null;

                // Upload new image if selected
                if (selectedFile) {
                    attachmentUrl = await uploadReceipt(selectedFile);
                }

                const payload = {
                    wallet_id: walletId,
                    category_id: categoryId,
                    type,
                    amount,
                    transaction_date: date,
                    notes: notes || null
                };

                if (attachmentUrl) payload.attachment_url = attachmentUrl;

                if (currentEditId) {
                    const { error } = await db.from('transactions').update(payload).eq('id', currentEditId);
                    if (error) throw error;
                } else {
                    const { error } = await db.from('transactions').insert(payload);
                    if (error) throw error;
                }

                closeAddTransactionModal();
                await loadData();
                if (document.getElementById('page-report').classList.contains('active')) {
                    loadChartData();
                    loadPieChart();
                }
                alert(currentEditId ? 'Transaction updated!' : 'Transaction saved!');

            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function editTransaction(id) {
            const trx = allTransactions.find(t => t.id === id);
            if (!trx) return;
            await openAddTransactionModal(trx);
        }

        async function deleteTransaction(id) {
            if (!confirm('Delete this transaction?')) return;
            try {
                const { error } = await db.from('transactions').delete().eq('id', id);
                if (error) throw error;
                await loadData();
                if (document.getElementById('page-report').classList.contains('active')) {
                    loadChartData();
                    loadPieChart();
                }
            } catch (err) {
                alert('Failed to delete: ' + err.message);
            }
        }

        // ==================== ADD WALLET ====================
        function openAddWalletModal() {
            const modalHTML = `
                <div id="addWalletModal" class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center z-[60]">
                    <div class="bg-white dark:bg-brand-surface w-full md:w-[380px] rounded-t-3xl md:rounded-3xl p-6">
                        <div class="flex justify-between mb-4">
                            <h3 class="text-xl font-bold">Add New Wallet</h3>
                            <button onclick="closeAddWalletModal()" class="text-2xl">&times;</button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm">Wallet Name</label>
                                <input id="walletName" class="w-full border rounded-2xl px-4 py-2.5" placeholder="e.g. BCA Savings">
                            </div>
                            <div>
                                <label class="text-sm">Type</label>
                                <select id="walletType" class="w-full border rounded-2xl px-4 py-2.5">
                                    <option value="bank">Bank</option>
                                    <option value="ewallet">E-Wallet</option>
                                    <option value="cash">Cash</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-sm">Initial Balance</label>
                                <input id="walletBalance" type="number" class="w-full border rounded-2xl px-4 py-2.5" value="0">
                            </div>
                            <button onclick="submitNewWallet()" class="w-full bg-brand-blue text-white py-3 rounded-2xl font-semibold mt-2">Create Wallet</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeAddWalletModal() {
            const modal = document.getElementById('addWalletModal');
            if (modal) modal.remove();
        }

        async function submitNewWallet() {
            const name = document.getElementById('walletName').value.trim();
            const type = document.getElementById('walletType').value;
            const balance = parseFloat(document.getElementById('walletBalance').value) || 0;

            if (!name) { alert('Wallet name is required'); return; }

            try {
                const { error } = await db.from('wallets').insert({
                    name, type, balance,
                    icon: type === 'bank' ? 'fa-building-columns' : (type === 'ewallet' ? 'fa-wallet' : 'fa-money-bill-wave'),
                    color: type === 'bank' ? 'text-blue-600' : (type === 'ewallet' ? 'text-orange-500' : 'text-green-600'),
                    bg: type === 'bank' ? 'bg-blue-100' : (type === 'ewallet' ? 'bg-orange-100' : 'bg-green-100')
                });
                if (error) throw error;
                closeAddWalletModal();
                await loadData();
                alert('Wallet created successfully!');
            } catch (err) {
                alert('Error creating wallet: ' + err.message);
            }
        }

        // ==================== EXPORT ====================
        function openExportModal() {
            document.getElementById('exportModal').classList.add('active');
        }

        function exportData(type) {
            const dataToExport = filteredTransactions.length > 0 ? filteredTransactions : allTransactions;
            if (type === 'csv') exportToCSV(dataToExport);
            else if (type === 'pdf') exportToPDF(dataToExport);
            document.getElementById('exportModal').classList.remove('active');
        }

        function exportToCSV(data) {
            let csv = 'Date,Category,Wallet,Type,Amount,Notes\n';
            data.forEach(t => {
                const cat = t.categories?.name || categoryMap[t.category_id] || '';
                const wal = t.wallets?.name || walletMap[t.wallet_id] || '';
                csv += `${t.transaction_date},${cat},${wal},${t.type},${t.amount},"${t.notes || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexgen-transactions-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function exportToPDF(data) {
            const element = document.createElement('div');
            element.innerHTML = `
                <h2 style="text-align:center; margin-bottom:20px;">NexGen Financial Report</h2>
                <table border="1" style="width:100%; border-collapse: collapse; font-size:12px;">
                    <thead><tr style="background:#f1f5f9;">
                        <th style="padding:8px;">Date</th><th style="padding:8px;">Category</th>
                        <th style="padding:8px;">Wallet</th><th style="padding:8px;">Type</th>
                        <th style="padding:8px; text-align:right;">Amount</th>
                    </tr></thead>
                    <tbody>
                        ${data.map(t => {
                            const cat = t.categories?.name || categoryMap[t.category_id] || '';
                            const wal = t.wallets?.name || walletMap[t.wallet_id] || '';
                            return `<tr>
                                <td style="padding:6px;">${t.transaction_date}</td>
                                <td style="padding:6px;">${cat}</td>
                                <td style="padding:6px;">${wal}</td>
                                <td style="padding:6px;">${t.type}</td>
                                <td style="padding:6px; text-align:right;">${formatRp(t.amount)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            `;
            html2pdf().from(element).set({
                margin: 10,
                filename: `nexgen-report-${new Date().toISOString().slice(0,10)}.pdf`
            }).save();
        }

        function openFilterModal() {
            switchPage('transaction');
            setTimeout(() => document.getElementById('filter-start-date').focus(), 300);
        }

        // ==================== INITIALIZATION ====================
        async function initializeApp() {
            setTimeout(() => {
                const container = document.getElementById('desktop-nav-container');
                const slider = document.getElementById('nav-slider');
                const activeBtn = container?.querySelector('.nav-btn.active');
                if (container && slider && activeBtn) {
                    slider.style.transition = 'none';
                    const cRect = container.getBoundingClientRect();
                    const bRect = activeBtn.getBoundingClientRect();
                    slider.style.left = `${bRect.left - cRect.left}px`;
                    slider.style.width = `${bRect.width}px`;
                    setTimeout(() => slider.style.transition = 'all 0.3s cubic-bezier(0.32, 0.72, 0, 1)', 50);
                }
            }, 80);

            await loadData();
            setupSearch();
            document.getElementById('nav-mob-dashboard')?.classList.add('active');

            setTimeout(() => {
                if (document.getElementById('page-report').classList.contains('active')) {
                    loadChartData();
                    loadPieChart();
                }
            }, 500);
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
