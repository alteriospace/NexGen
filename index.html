<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen | Financial Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { blue: '#2563EB', dark: '#0B1120', surface: '#171E2E' }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .page-section { display: none; opacity: 0; transform: translateY(15px); }
        .page-section.active { display: block; animation: slideUpFade 0.4s ease forwards; }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* DESKTOP NAV - SLIDING */
        .desktop-nav {
            position: relative;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 9999px;
            border: 1px solid #e2e8f0;
        }
        .dark .desktop-nav {
            background-color: #1e293b;
            border-color: #334155;
        }

        .nav-btn {
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
            padding: 9px 24px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn.active { color: white; font-weight: 600; }
        .dark .nav-btn.active { color: #0f172a; }

        .nav-slider {
            position: absolute;
            top: 4px;
            left: 0;
            height: calc(100% - 8px);
            background-color: #0f172a;
            border-radius: 9999px;
            z-index: 1;
            transition: all 0.32s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
        }
        .dark .nav-slider {
            background-color: #f1f5f9;
            box-shadow: 0 2px 8px rgba(241, 245, 249, 0.15);
        }

        /* MOBILE BOTTOM NAV - CLEAN SLIDING */
        .mobile-nav {
            position: relative;
            background-color: rgba(255,255,255,0.96);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 4px;
        }
        .dark .mobile-nav {
            background-color: rgba(23, 30, 46, 0.96);
            border-color: #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-mob-btn {
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #64748B;
        }
        .dark .nav-mob-btn { color: #94A3B8; }

        .nav-mob-btn.active { color: white; }
        .dark .nav-mob-btn.active { color: white; }

        .mobile-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 48px;
            height: 48px;
            background-color: #2563EB;
            border-radius: 12px;
            z-index: 1;
            transition: all 0.32s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .dark .mobile-slider {
            background-color: #3B82F6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; }
        .modal-backdrop.active { display: block; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-brand-dark text-gray-900 dark:text-gray-100 flex flex-col h-screen overflow-hidden antialiased">

    <!-- HEADER -->
    <header class="h-20 bg-white dark:bg-brand-surface px-6 md:px-10 flex justify-between items-center z-30 border-b border-gray-100 dark:border-gray-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-brand-blue rounded-2xl flex items-center justify-center text-white text-xl shadow-sm"><i class="fa-solid fa-bolt"></i></div>
            <h1 class="text-2xl font-extrabold tracking-tighter">NexGen</h1>
        </div>

        <!-- DESKTOP NAV -->
        <nav class="hidden md:block">
            <div class="desktop-nav flex items-center relative" id="desktop-nav-container">
                <div id="nav-slider" class="nav-slider"></div>
                
                <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-btn active">
                    <i class="fa-solid fa-border-all w-4"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="switchPage('report')" id="nav-report" class="nav-btn">
                    <i class="fa-solid fa-chart-line w-4"></i>
                    <span>Analytics</span>
                </button>
                <button onclick="switchPage('transaction')" id="nav-transaction" class="nav-btn">
                    <i class="fa-solid fa-list w-4"></i>
                    <span>Transactions</span>
                </button>
                <button onclick="switchPage('wallet')" id="nav-wallet" class="nav-btn">
                    <i class="fa-solid fa-wallet w-4"></i>
                    <span>Wallets</span>
                </button>
            </div>
        </nav>

        <div onclick="toggleTheme()" class="bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl flex items-center p-1 w-[68px] h-9 cursor-pointer relative">
            <div class="absolute left-2.5 text-xs text-gray-400"><i class="fa-solid fa-sun"></i></div>
            <div class="absolute right-2.5 text-xs text-gray-500"><i class="fa-solid fa-moon"></i></div>
            <div id="theme-slider" class="w-7 h-7 bg-white dark:bg-gray-700 rounded-2xl shadow-sm flex items-center justify-center transition-transform duration-300" style="transform: translateX(0);">
                <i class="fa-solid fa-sun text-yellow-500 text-xs dark:hidden"></i>
                <i class="fa-solid fa-moon text-indigo-300 text-xs hidden dark:block"></i>
            </div>
        </div>
    </header>

    <main id="main-scroll" class="flex-1 overflow-y-auto hide-scrollbar p-5 md:p-8 pb-20 md:pb-8">
        
        <div class="max-w-7xl mx-auto flex justify-between items-end mb-6">
            <div>
                <h2 class="text-3xl font-bold tracking-tight" id="header-title">Dashboard Overview</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="header-subtitle">Your current financial summary and activity</p>
            </div>
            <div class="hidden md:flex gap-3">
                <button onclick="openExportModal()" class="px-4 py-2 rounded-2xl border text-sm font-semibold flex items-center gap-2 bg-white dark:bg-brand-surface">Export</button>
                <button onclick="openFilterModal()" class="px-4 py-2 rounded-2xl bg-brand-blue text-white text-sm font-semibold flex items-center gap-2">Filter</button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-section active space-y-6 max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-6 rounded-3xl text-white">
                    <div class="flex justify-between mb-5">
                        <div>
                            <p class="text-blue-100 text-xs tracking-[1px]">TOTAL BALANCE</p>
                            <h3 class="text-4xl font-extrabold mt-1" id="dash-balance">Rp 0</h3>
                        </div>
                        <div class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-wallet"></i></div>
                    </div>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <p class="text-sm text-gray-500">TOTAL INCOME</p>
                    <h3 class="text-3xl font-extrabold mt-1" id="dash-income">Rp 0</h3>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <p class="text-sm text-gray-500">TOTAL EXPENSE</p>
                    <h3 class="text-3xl font-extrabold mt-1" id="dash-expense">Rp 0</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <h3 class="font-bold mb-4">My Wallets</h3>
                    <div id="dash-wallet-list" class="space-y-3"></div>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <h3 class="font-bold mb-4">Recent Transactions</h3>
                    <div id="dash-trx-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- ANALYTICS -->
        <div id="page-report" class="page-section space-y-6 max-w-7xl mx-auto">
            <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                <h3 class="font-bold mb-4">Performance Overview</h3>
                <div class="h-[320px]"><canvas id="barChart"></canvas></div>
            </div>
        </div>

        <!-- TRANSACTIONS -->
        <div id="page-transaction" class="page-section max-w-7xl mx-auto">
            <div class="bg-white dark:bg-brand-surface rounded-3xl border overflow-hidden">
                <div class="p-5 flex justify-between items-center border-b">
                    <input type="text" id="search-trx" placeholder="Search..." class="w-72 bg-gray-50 dark:bg-gray-800 border rounded-2xl px-4 py-2 text-sm">
                    <button onclick="openAddTransactionModal()" class="bg-brand-blue text-white px-5 py-2 rounded-2xl text-sm font-semibold">+ Add Transaction</button>
                </div>
                <table class="w-full">
                    <thead class="bg-gray-50 dark:bg-gray-800/50 text-xs">
                        <tr>
                            <th class="p-4 text-left">Date</th>
                            <th class="p-4 text-left">Description</th>
                            <th class="p-4 text-center">Proof</th>
                            <th class="p-4 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="full-trx-list" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- WALLETS -->
        <div id="page-wallet" class="page-section max-w-7xl mx-auto">
            <div class="flex justify-between mb-5">
                <h3 class="text-2xl font-bold">Wallets</h3>
                <button onclick="openAddWalletModal()" class="bg-brand-blue text-white px-5 py-2 rounded-2xl text-sm">+ Add Wallet</button>
            </div>
            <div id="full-wallet-grid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
        </div>

    </main>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50" style="width: 248px;">
        <div class="mobile-nav flex items-center justify-between relative px-1 py-1 rounded-3xl border" id="mobile-nav-container">
            <div id="mobile-slider" class="mobile-slider"></div>
            
            <button onclick="switchPage('dashboard')" id="nav-mob-dashboard" class="nav-mob-btn active">
                <i class="fa-solid fa-border-all"></i>
            </button>
            <button onclick="switchPage('report')" id="nav-mob-report" class="nav-mob-btn">
                <i class="fa-solid fa-chart-line"></i>
            </button>
            <button onclick="switchPage('transaction')" id="nav-mob-transaction" class="nav-mob-btn">
                <i class="fa-solid fa-list"></i>
            </button>
            <button onclick="switchPage('wallet')" id="nav-mob-wallet" class="nav-mob-btn">
                <i class="fa-solid fa-wallet"></i>
            </button>
        </div>
    </nav>

    <div id="exportModal" class="modal-backdrop" onclick="this.classList.remove('active')">
        <div class="fixed inset-0 flex items-center justify-center p-4" onclick="event.stopPropagation()">
            <div class="bg-white dark:bg-brand-surface rounded-3xl p-6 w-full max-w-sm">
                <h3 class="font-bold text-xl mb-4">Export Statement</h3>
                <div class="flex gap-3">
                    <button onclick="exportData('pdf')" class="flex-1 py-3 bg-red-500 text-white rounded-2xl">PDF</button>
                    <button onclick="exportData('csv')" class="flex-1 py-3 bg-emerald-500 text-white rounded-2xl">CSV</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://[GANTI_DENGAN_URL_PROJECT_ANDA].supabase.co';
        const SUPABASE_KEY = '[GANTI_DENGAN_API_KEY_ANDA]';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myWallets = [];
        let allTransactions = [];
        let filteredTransactions = [];

        function formatRp(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const slider = document.getElementById('theme-slider');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark');
                slider.style.transform = 'translateX(32px)';
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                slider.style.transform = 'translateX(0)';
            }
        }

        function switchPage(pageId) {
            updateActiveNav(pageId);

            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const page = document.getElementById('page-' + pageId);
            if (page) page.classList.add('active');

            const titles = {
                dashboard: { title: 'Dashboard Overview', sub: 'Your current financial summary and activity' },
                report:    { title: 'Analytics', sub: 'Detailed breakdown of your income and expenses' },
                transaction:{ title: 'Transactions', sub: 'Complete history of your financial activity' },
                wallet:    { title: 'Portfolio & Wallets', sub: 'Manage all your connected accounts' }
            };
            if (titles[pageId]) {
                document.getElementById('header-title').innerText = titles[pageId].title;
                document.getElementById('header-subtitle').innerText = titles[pageId].sub;
            }

            requestAnimationFrame(() => {
                document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
                if (pageId === 'report') setTimeout(renderCharts, 60);
            });
        }

        function updateActiveNav(pageId) {
            // Desktop
            const deskContainer = document.getElementById('desktop-nav-container');
            const deskSlider = document.getElementById('nav-slider');
            const deskBtn = document.getElementById('nav-' + pageId);

            if (deskContainer && deskSlider && deskBtn) {
                deskContainer.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                deskBtn.classList.add('active');

                const cRect = deskContainer.getBoundingClientRect();
                const bRect = deskBtn.getBoundingClientRect();
                deskSlider.style.left = `${bRect.left - cRect.left}px`;
                deskSlider.style.width = `${bRect.width}px`;
            }

            // Mobile
            const mobContainer = document.getElementById('mobile-nav-container');
            const mobSlider = document.getElementById('mobile-slider');
            const mobBtn = document.getElementById('nav-mob-' + pageId);

            if (mobContainer && mobSlider && mobBtn) {
                mobContainer.querySelectorAll('.nav-mob-btn').forEach(b => b.classList.remove('active'));
                mobBtn.classList.add('active');

                const cRect = mobContainer.getBoundingClientRect();
                const bRect = mobBtn.getBoundingClientRect();
                mobSlider.style.left = `${bRect.left - cRect.left}px`;
            }
        }

        // Initialize sliders - INSTANT on load
        function initSlidersInstant() {
            // Desktop - Black slider on Dashboard (instant)
            const deskContainer = document.getElementById('desktop-nav-container');
            const deskSlider = document.getElementById('nav-slider');
            const activeDesk = deskContainer.querySelector('.nav-btn.active');

            if (activeDesk && deskSlider) {
                // Disable transition temporarily
                deskSlider.style.transition = 'none';
                
                const cRect = deskContainer.getBoundingClientRect();
                const bRect = activeDesk.getBoundingClientRect();
                
                deskSlider.style.left = `${bRect.left - cRect.left}px`;
                deskSlider.style.width = `${bRect.width}px`;
                
                // Force reflow then re-enable transition
                void deskSlider.offsetWidth;
                
                setTimeout(() => {
                    deskSlider.style.transition = 'all 0.32s cubic-bezier(0.32, 0.72, 0, 1)';
                }, 30);
            }

            // Mobile
            const mobContainer = document.getElementById('mobile-nav-container');
            const mobSlider = document.getElementById('mobile-slider');
            const activeMob = mobContainer.querySelector('.nav-mob-btn.active');

            if (activeMob && mobSlider) {
                mobSlider.style.transition = 'none';
                
                const cRect = mobContainer.getBoundingClientRect();
                const bRect = activeMob.getBoundingClientRect();
                mobSlider.style.left = `${bRect.left - cRect.left}px`;
                
                void mobSlider.offsetWidth;
                
                setTimeout(() => {
                    mobSlider.style.transition = 'all 0.32s cubic-bezier(0.32, 0.72, 0, 1)';
                }, 30);
            }
        }

        function renderWalletsHTML() {
            const dash = document.getElementById('dash-wallet-list');
            const grid = document.getElementById('full-wallet-grid');
            if (!dash || !grid) return;

            dash.innerHTML = '';
            grid.innerHTML = '';

            myWallets.forEach(w => {
                dash.innerHTML += `
                    <div class="flex justify-between p-3 border rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl ${w.bg} ${w.color} flex items-center justify-center"><i class="fa-solid ${w.icon}"></i></div>
                            <span class="font-semibold">${w.name}</span>
                        </div>
                        <span class="font-bold">${formatRp(w.balance)}</span>
                    </div>
                `;

                grid.innerHTML += `
                    <div class="p-6 border rounded-3xl">
                        <div class="w-11 h-11 rounded-2xl ${w.bg} ${w.color} flex items-center justify-center mb-4"><i class="fa-solid ${w.icon} text-xl"></i></div>
                        <p class="text-sm text-gray-500">${w.name}</p>
                        <p class="text-2xl font-extrabold mt-1">${formatRp(w.balance)}</p>
                    </div>
                `;
            });
        }

        function renderTransactionsTable(data) {
            const tbody = document.getElementById('full-trx-list');
            tbody.innerHTML = '';
            data.forEach(t => {
                const sign = t.type === 'income' ? '+' : '-';
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-4">${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td>
                        <td class="p-4">${t.category}</td>
                        <td class="p-4 text-center">${t.attachment_url ? '✓' : ''}</td>
                        <td class="p-4 text-right font-bold">${sign} ${formatRp(t.amount)}</td>
                    </tr>
                `;
            });
        }

        let barChart;
        function renderCharts() {
            if (barChart) barChart.destroy();
            const ctx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['May','Jun','Jul','Aug','Sep','Oct'],
                    datasets: [{
                        label: 'Income',
                        data: [12, 19, 14, 22, 17, 25],
                        backgroundColor: '#2563EB'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        async function initData() {
            myWallets = [
                { name: "BCA Primary", balance: 18500000, icon: "fa-building-columns", color: "text-blue-600", bg: "bg-blue-100" },
                { name: "SeaBank", balance: 4200000, icon: "fa-wallet", color: "text-orange-500", bg: "bg-orange-100" }
            ];

            allTransactions = [
                { type: "income", category: "Salary", amount: 8500000, transaction_date: "2026-05-28", attachment_url: null },
                { type: "expense", category: "Food & Drink", amount: 125000, transaction_date: "2026-05-27", attachment_url: "https://picsum.photos/200" }
            ];
            filteredTransactions = allTransactions;

            document.getElementById('dash-balance').innerText = formatRp(22700000);
            document.getElementById('dash-income').innerText = formatRp(8500000);
            document.getElementById('dash-expense').innerText = formatRp(125000);

            renderWalletsHTML();
            renderTransactionsTable(allTransactions);
            renderCharts();
        }

        function setupSearch() {
            const input = document.getElementById('search-trx');
            input.addEventListener('input', () => {
                const kw = input.value.toLowerCase();
                filteredTransactions = allTransactions.filter(t => t.category.toLowerCase().includes(kw));
                renderTransactionsTable(filteredTransactions);
            });
        }

        function initialize() {
            // Initialize sliders FIRST (before any async operation)
            initSlidersInstant();

            initData();
            setupSearch();

            // Ensure mobile active state
            document.getElementById('nav-mob-dashboard').classList.add('active');
        }

        function openExportModal() { document.getElementById('exportModal').classList.add('active'); }
        function openFilterModal() { alert('Filter modal (demo)'); }
        function openAddTransactionModal() { alert('Add Transaction modal (demo)'); }
        function openAddWalletModal() { alert('Add Wallet modal (demo)'); }
        function exportData(type) { alert('Exporting as ' + type); document.getElementById('exportModal').classList.remove('active'); }

        // Run immediately when script loads
        initialize();
    </script>
</body>
</html>
