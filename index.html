<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen | Financial Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { blue: '#2563EB', dark: '#0B1120', surface: '#171E2E' }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .page-section { display: none; opacity: 0; transform: translateY(15px); }
        .page-section.active { display: block; animation: slideUpFade 0.4s ease forwards; }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        .desktop-nav {
            position: relative;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 9999px;
            border: 1px solid #e2e8f0;
        }
        .dark .desktop-nav {
            background-color: #1e293b;
            border-color: #334155;
        }

        .nav-btn {
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
            padding: 9px 24px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn.active { color: white; font-weight: 600; }
        .dark .nav-btn.active { color: #0f172a; }

        .nav-slider {
            position: absolute;
            top: 4px;
            left: 0;
            height: calc(100% - 8px);
            background-color: #0f172a;
            border-radius: 9999px;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
        }
        .dark .nav-slider {
            background-color: #f1f5f9;
            box-shadow: 0 2px 8px rgba(241, 245, 249, 0.15);
        }

        .mobile-nav {
            position: relative;
            background-color: rgba(255,255,255,0.96);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 4px;
        }
        .dark .mobile-nav {
            background-color: rgba(23, 30, 46, 0.96);
            border-color: #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-mob-btn {
            position: relative;
            z-index: 2;
            transition: color 0.2s ease;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #64748B;
        }
        .dark .nav-mob-btn { color: #94A3B8; }

        .nav-mob-btn.active { color: white; }
        .dark .nav-mob-btn.active { color: white; }

        .mobile-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 48px;
            height: 48px;
            background-color: #2563EB;
            border-radius: 9999px;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .dark .mobile-slider {
            background-color: #3B82F6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; }
        .modal-backdrop.active { display: block; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-brand-dark text-gray-900 dark:text-gray-100 flex flex-col h-screen overflow-hidden antialiased">

    <!-- HEADER -->
    <header class="h-20 bg-white dark:bg-brand-surface px-6 md:px-10 flex justify-between items-center z-30 border-b border-gray-100 dark:border-gray-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-brand-blue rounded-2xl flex items-center justify-center text-white text-xl shadow-sm"><i class="fa-solid fa-bolt"></i></div>
            <h1 class="text-2xl font-extrabold tracking-tighter">NexGen</h1>
        </div>

        <!-- DESKTOP NAV -->
        <nav class="hidden md:block">
            <div class="desktop-nav flex items-center relative" id="desktop-nav-container">
                <div id="nav-slider" class="nav-slider" style="left: 5px; width: 145px;"></div>
                
                <button onclick="switchPage('dashboard')" id="nav-dashboard" class="nav-btn active">
                    <i class="fa-solid fa-border-all w-4"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="switchPage('report')" id="nav-report" class="nav-btn">
                    <i class="fa-solid fa-chart-line w-4"></i>
                    <span>Analytics</span>
                </button>
                <button onclick="switchPage('transaction')" id="nav-transaction" class="nav-btn">
                    <i class="fa-solid fa-list w-4"></i>
                    <span>Transactions</span>
                </button>
                <button onclick="switchPage('wallet')" id="nav-wallet" class="nav-btn">
                    <i class="fa-solid fa-wallet w-4"></i>
                    <span>Wallets</span>
                </button>
            </div>
        </nav>

        <div onclick="toggleTheme()" class="bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl flex items-center p-1 w-[68px] h-9 cursor-pointer relative">
            <div class="absolute left-2.5 text-xs text-gray-400"><i class="fa-solid fa-sun"></i></div>
            <div class="absolute right-2.5 text-xs text-gray-500"><i class="fa-solid fa-moon"></i></div>
            <div id="theme-slider" class="w-7 h-7 bg-white dark:bg-gray-700 rounded-2xl shadow-sm flex items-center justify-center transition-transform duration-300" style="transform: translateX(0);">
                <i class="fa-solid fa-sun text-yellow-500 text-xs dark:hidden"></i>
                <i class="fa-solid fa-moon text-indigo-300 text-xs hidden dark:block"></i>
            </div>
        </div>
    </header>

    <main id="main-scroll" class="flex-1 overflow-y-auto hide-scrollbar p-5 md:p-8 pb-20 md:pb-8">
        
        <div class="max-w-7xl mx-auto flex justify-between items-end mb-6">
            <div>
                <h2 class="text-3xl font-bold tracking-tight" id="header-title">Dashboard Overview</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="header-subtitle">Your current financial summary and activity</p>
            </div>
            <div class="flex gap-2 md:gap-3">
                <button onclick="openExportModal()" 
                        class="px-3 py-1.5 md:px-4 md:py-2 rounded-2xl border text-xs md:text-sm font-semibold flex items-center gap-2 bg-white dark:bg-brand-surface">
                    <i class="fa-solid fa-download md:hidden"></i>
                    <span class="hidden md:inline">Export</span>
                </button>
                <button onclick="openFilterModal()" 
                        class="px-3 py-1.5 md:px-4 md:py-2 rounded-2xl bg-brand-blue text-white text-xs md:text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-filter md:hidden"></i>
                    <span class="hidden md:inline">Filter</span>
                </button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-section active space-y-6 max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-6 rounded-3xl text-white">
                    <div class="flex justify-between mb-5">
                        <div>
                            <p class="text-blue-100 text-xs tracking-[1px]">TOTAL BALANCE</p>
                            <h3 class="text-4xl font-extrabold mt-1" id="dash-balance">Rp 0</h3>
                        </div>
                        <div class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-wallet"></i></div>
                    </div>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <p class="text-sm text-gray-500">TOTAL INCOME</p>
                    <h3 class="text-3xl font-extrabold mt-1" id="dash-income">Rp 0</h3>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <p class="text-sm text-gray-500">TOTAL EXPENSE</p>
                    <h3 class="text-3xl font-extrabold mt-1" id="dash-expense">Rp 0</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <h3 class="font-bold mb-4">My Wallets</h3>
                    <div id="dash-wallet-list" class="space-y-3"></div>
                </div>
                <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                    <h3 class="font-bold mb-4">Recent Transactions</h3>
                    <div id="dash-trx-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- ANALYTICS -->
        <div id="page-report" class="page-section space-y-6 max-w-7xl mx-auto">
            <div class="bg-white dark:bg-brand-surface p-6 rounded-3xl border">
                <h3 class="font-bold mb-4">Performance Overview</h3>
                <div class="h-[320px]"><canvas id="barChart"></canvas></div>
            </div>
        </div>

        <!-- TRANSACTIONS -->
        <div id="page-transaction" class="page-section max-w-7xl mx-auto">
            <div class="bg-white dark:bg-brand-surface rounded-3xl border overflow-hidden">
                <div class="p-5 flex flex-col md:flex-row gap-3 md:gap-3 md:items-center border-b">
                    <input type="text" id="search-trx" placeholder="Search..." 
                           class="flex-1 bg-gray-50 dark:bg-gray-800 border rounded-2xl px-4 py-2 text-sm">
                    <button onclick="openAddTransactionModal()" 
                            class="bg-brand-blue hover:bg-blue-700 active:bg-blue-800 text-white w-full md:w-auto px-5 py-2.5 rounded-2xl text-sm md:text-base font-semibold flex items-center justify-center gap-2 shadow-sm active:scale-[0.985] transition-all">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Transaction</span>
                    </button>
                </div>
                <table class="w-full">
                    <thead class="bg-gray-50 dark:bg-gray-800/50 text-xs">
                        <tr>
                            <th class="p-4 text-left">Date</th>
                            <th class="p-4 text-left">Description</th>
                            <th class="p-4 text-center">Proof</th>
                            <th class="p-4 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="full-trx-list" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- WALLETS -->
        <div id="page-wallet" class="page-section max-w-7xl mx-auto">
            <div class="flex justify-between mb-5">
                <h3 class="text-2xl font-bold">Wallets</h3>
                <button onclick="openAddWalletModal()" class="bg-brand-blue text-white px-5 py-2 rounded-2xl text-sm">+ Add Wallet</button>
            </div>
            <div id="full-wallet-grid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
        </div>

    </main>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50" style="width: 248px;">
        <div class="mobile-nav flex items-center justify-between relative px-1 py-1 rounded-3xl border" id="mobile-nav-container">
            <div id="mobile-slider" class="mobile-slider"></div>
            
            <button onclick="switchPage('dashboard')" id="nav-mob-dashboard" class="nav-mob-btn active">
                <i class="fa-solid fa-border-all"></i>
            </button>
            <button onclick="switchPage('report')" id="nav-mob-report" class="nav-mob-btn">
                <i class="fa-solid fa-chart-line"></i>
            </button>
            <button onclick="switchPage('transaction')" id="nav-mob-transaction" class="nav-mob-btn">
                <i class="fa-solid fa-list"></i>
            </button>
            <button onclick="switchPage('wallet')" id="nav-mob-wallet" class="nav-mob-btn">
                <i class="fa-solid fa-wallet"></i>
            </button>
        </div>
    </nav>

    <div id="exportModal" class="modal-backdrop" onclick="this.classList.remove('active')">
        <div class="fixed inset-0 flex items-center justify-center p-4" onclick="event.stopPropagation()">
            <div class="bg-white dark:bg-brand-surface rounded-3xl p-6 w-full max-w-sm">
                <h3 class="font-bold text-xl mb-4">Export Statement</h3>
                <div class="flex gap-3">
                    <button onclick="exportData('pdf')" class="flex-1 py-3 bg-red-500 text-white rounded-2xl">PDF</button>
                    <button onclick="exportData('csv')" class="flex-1 py-3 bg-emerald-500 text-white rounded-2xl">CSV</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://[GANTI_DENGAN_URL_PROJECT_ANDA].supabase.co';
        const SUPABASE_KEY = '[GANTI_DENGAN_ANON_KEY_ANDA]';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myWallets = [];
        let allTransactions = [];
        let filteredTransactions = [];
        let barChart;

        function formatRp(num) {
            return 'Rp ' + Number(num).toLocaleString('id-ID');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const slider = document.getElementById('theme-slider');
            if (html.classList.contains('light')) {
                html.classList.remove('light'); html.classList.add('dark');
                slider.style.transform = 'translateX(32px)';
            } else {
                html.classList.remove('dark'); html.classList.add('light');
                slider.style.transform = 'translateX(0)';
            }
        }

        function switchPage(pageId) {
            updateActiveNav(pageId);

            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const page = document.getElementById('page-' + pageId);
            if (page) page.classList.add('active');

            const titles = {
                dashboard: { title: 'Dashboard Overview', sub: 'Your current financial summary and activity' },
                report:    { title: 'Analytics', sub: 'Detailed breakdown of your income and expenses' },
                transaction:{ title: 'Transactions', sub: 'Complete history of your financial activity' },
                wallet:    { title: 'Portfolio & Wallets', sub: 'Manage all your connected accounts' }
            };
            if (titles[pageId]) {
                document.getElementById('header-title').innerText = titles[pageId].title;
                document.getElementById('header-subtitle').innerText = titles[pageId].sub;
            }

            requestAnimationFrame(() => {
                document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
                if (pageId === 'report') setTimeout(renderCharts, 60);
            });
        }

        function updateActiveNav(pageId) {
            const deskContainer = document.getElementById('desktop-nav-container');
            const deskSlider = document.getElementById('nav-slider');
            const deskBtn = document.getElementById('nav-' + pageId);

            if (deskContainer && deskSlider && deskBtn) {
                deskContainer.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                deskBtn.classList.add('active');

                const cRect = deskContainer.getBoundingClientRect();
                const bRect = deskBtn.getBoundingClientRect();
                deskSlider.style.left = `${bRect.left - cRect.left}px`;
                deskSlider.style.width = `${bRect.width}px`;
            }

            const mobContainer = document.getElementById('mobile-nav-container');
            const mobSlider = document.getElementById('mobile-slider');
            const mobBtn = document.getElementById('nav-mob-' + pageId);

            if (mobContainer && mobSlider && mobBtn) {
                mobContainer.querySelectorAll('.nav-mob-btn').forEach(b => b.classList.remove('active'));
                mobBtn.classList.add('active');

                const cRect = mobContainer.getBoundingClientRect();
                const bRect = mobBtn.getBoundingClientRect();
                mobSlider.style.left = `${bRect.left - cRect.left}px`;
            }
        }

        function setSliderExactSize() {
            const container = document.getElementById('desktop-nav-container');
            const slider = document.getElementById('nav-slider');
            const activeBtn = container.querySelector('.nav-btn.active');

            if (!container || !slider || !activeBtn) return;

            slider.style.transition = 'none';

            const containerLeft = container.getBoundingClientRect().left;
            const btnLeft = activeBtn.getBoundingClientRect().left;
            const btnWidth = activeBtn.getBoundingClientRect().width;

            slider.style.left = `${btnLeft - containerLeft}px`;
            slider.style.width = `${btnWidth}px`;

            void slider.offsetWidth;

            setTimeout(() => {
                slider.style.transition = 'all 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
            }, 10);
        }

        // ==================== SUPABASE FUNCTIONS ====================
        async function fetchWallets() {
            const { data, error } = await db.from('wallets').select('*').order('created_at');
            if (error) {
                console.error('Error fetching wallets:', error);
                return;
            }
            myWallets = data || [];
        }

        async function fetchTransactions() {
            const { data, error } = await db
                .from('transactions')
                .select(`*, wallet:wallet_id(name)`)
                .order('transaction_date', { ascending: false });
            
            if (error) {
                console.error('Error fetching transactions:', error);
                return;
            }
            
            allTransactions = (data || []).map(t => ({
                ...t,
                wallet_name: t.wallet?.name || 'Unknown'
            }));
            filteredTransactions = [...allTransactions];
        }

        async function initData() {
            await fetchWallets();
            await fetchTransactions();

            // Calculate totals
            const totalBalance = myWallets.reduce((sum, w) => sum + parseFloat(w.balance || 0), 0);
            const totalIncome = allTransactions
                .filter(t => t.type === 'income')
                .reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
            const totalExpense = allTransactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);

            document.getElementById('dash-balance').innerText = formatRp(totalBalance);
            document.getElementById('dash-income').innerText = formatRp(totalIncome);
            document.getElementById('dash-expense').innerText = formatRp(totalExpense);

            renderWalletsHTML();
            renderRecentTransactions();
            renderTransactionsTable(allTransactions);
            renderCharts();
        }

        function renderWalletsHTML() {
            const dash = document.getElementById('dash-wallet-list');
            const grid = document.getElementById('full-wallet-grid');
            if (!dash || !grid) return;

            dash.innerHTML = '';
            grid.innerHTML = '';

            myWallets.forEach(w => {
                dash.innerHTML += `
                    <div class="flex justify-between p-3 border rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl ${w.bg} ${w.color} flex items-center justify-center"><i class="fa-solid ${w.icon}"></i></div>
                            <span class="font-semibold">${w.name}</span>
                        </div>
                        <span class="font-bold">${formatRp(w.balance)}</span>
                    </div>
                `;

                grid.innerHTML += `
                    <div class="p-6 border rounded-3xl">
                        <div class="w-11 h-11 rounded-2xl ${w.bg} ${w.color} flex items-center justify-center mb-4"><i class="fa-solid ${w.icon} text-xl"></i></div>
                        <p class="text-sm text-gray-500">${w.name}</p>
                        <p class="text-2xl font-extrabold mt-1">${formatRp(w.balance)}</p>
                    </div>
                `;
            });
        }

        function renderRecentTransactions() {
            const container = document.getElementById('dash-trx-list');
            if (!container) return;

            container.innerHTML = '';
            const recent = [...allTransactions]
                .sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date))
                .slice(0, 5);

            recent.forEach(t => {
                const sign = t.type === 'income' ? '+' : '-';
                const color = t.type === 'income' ? 'text-emerald-600' : 'text-red-600';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-3 border rounded-2xl">
                        <div>
                            <p class="font-medium">${t.category}</p>
                            <p class="text-xs text-gray-500">${new Date(t.transaction_date).toLocaleDateString('id-ID')} • ${t.wallet_name}</p>
                        </div>
                        <span class="font-bold ${color}">${sign} ${formatRp(t.amount)}</span>
                    </div>
                `;
            });
        }

        function renderTransactionsTable(data) {
            const tbody = document.getElementById('full-trx-list');
            tbody.innerHTML = '';
            data.forEach(t => {
                const sign = t.type === 'income' ? '+' : '-';
                const color = t.type === 'income' ? 'text-emerald-600' : 'text-red-600';
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 dark:hover:bg-gray-800/50">
                        <td class="p-4">${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td>
                        <td class="p-4">
                            <div>${t.category}</div>
                            <div class="text-xs text-gray-500">${t.wallet_name}</div>
                        </td>
                        <td class="p-4 text-center">${t.attachment_url ? '<i class="fa-solid fa-image text-blue-500"></i>' : ''}</td>
                        <td class="p-4 text-right font-bold ${color}">${sign} ${formatRp(t.amount)}</td>
                    </tr>
                `;
            });
        }

        function renderCharts() {
            if (barChart) barChart.destroy();
            const ctx = document.getElementById('barChart').getContext('2d');
            
            // Simple monthly summary (bisa dikembangkan)
            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['May','Jun','Jul','Aug','Sep','Oct'],
                    datasets: [{
                        label: 'Income',
                        data: [12, 19, 14, 22, 17, 25],
                        backgroundColor: '#2563EB'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function setupSearch() {
            const input = document.getElementById('search-trx');
            input.addEventListener('input', () => {
                const kw = input.value.toLowerCase();
                filteredTransactions = allTransactions.filter(t => 
                    t.category.toLowerCase().includes(kw) || 
                    (t.wallet_name && t.wallet_name.toLowerCase().includes(kw))
                );
                renderTransactionsTable(filteredTransactions);
            });
        }

        function initialize() {
            setSliderExactSize();

            requestAnimationFrame(() => {
                setSliderExactSize();
            });

            initData();
            setupSearch();

            document.getElementById('nav-mob-dashboard').classList.add('active');

            setTimeout(() => {
                setSliderExactSize();
            }, 80);
        }

        // ==================== MODALS & ACTIONS ====================
        function openExportModal() { 
            document.getElementById('exportModal').classList.add('active'); 
        }
        
        function openFilterModal() { 
            alert('Filter modal akan segera hadir dengan fitur advanced!'); 
        }

        function openAddTransactionModal() {
            const modalHTML = `
                <div id="addTrxModal" class="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center z-[60]">
                    <div class="bg-white dark:bg-brand-surface w-full md:w-[420px] rounded-t-3xl md:rounded-3xl p-6">
                        <div class="flex justify-between items-center mb-5">
                            <h3 class="text-xl font-bold">Add Transaction</h3>
                            <button onclick="closeAddTransactionModal()" class="text-2xl leading-none">&times;</button>
                        </div>

                        <form id="addTrxForm" onsubmit="submitTransaction(event)">
                            <!-- Type -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Type</label>
                                <div class="flex gap-2">
                                    <label class="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="expense" checked class="peer hidden">
                                        <div class="peer-checked:bg-red-500 peer-checked:text-white border border-red-200 text-red-600 rounded-2xl py-2 text-center text-sm font-semibold">Expense</div>
                                    </label>
                                    <label class="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="income" class="peer hidden">
                                        <div class="peer-checked:bg-emerald-500 peer-checked:text-white border border-emerald-200 text-emerald-600 rounded-2xl py-2 text-center text-sm font-semibold">Income</div>
                                    </label>
                                </div>
                            </div>

                            <!-- Wallet -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Wallet</label>
                                <select id="trxWallet" class="w-full border rounded-2xl px-4 py-2.5 text-sm bg-white dark:bg-brand-surface" required>
                                    <option value="">-- Pilih Dompet --</option>
                                </select>
                            </div>

                            <!-- Category -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Category</label>
                                <select id="trxCategory" class="w-full border rounded-2xl px-4 py-2.5 text-sm bg-white dark:bg-brand-surface" required>
                                    <option value="">-- Pilih Kategori --</option>
                                </select>
                            </div>

                            <!-- Amount -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Amount</label>
                                <input type="number" id="trxAmount" class="w-full border rounded-2xl px-4 py-2.5 text-sm" placeholder="0" required>
                            </div>

                            <!-- Date -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Date</label>
                                <input type="date" id="trxDate" class="w-full border rounded-2xl px-4 py-2.5 text-sm" value="${new Date().toISOString().split('T')[0]}" required>
                            </div>

                            <!-- Notes -->
                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-1.5">Notes (Optional)</label>
                                <textarea id="trxNotes" class="w-full border rounded-2xl px-4 py-2.5 text-sm" rows="2" placeholder="Catatan..."></textarea>
                            </div>

                            <!-- Proof -->
                            <div class="mb-6">
                                <label class="block text-sm font-medium mb-1.5">Proof (Optional)</label>
                                <input type="file" id="trxProof" accept="image/*" class="w-full text-sm">
                            </div>

                            <button type="submit" 
                                    class="w-full bg-brand-blue hover:bg-blue-700 text-white py-3 rounded-2xl font-semibold text-base">
                                Save Transaction
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
            
            populateWalletDropdown();
            populateCategoryDropdown();
        }

        function closeAddTransactionModal() {
            const modal = document.getElementById('addTrxModal');
            if (modal) modal.remove();
        }

        function populateWalletDropdown() {
            const select = document.getElementById('trxWallet');
            if (!select) return;

            select.innerHTML = '<option value="">-- Pilih Dompet --</option>';
            myWallets.forEach(w => {
                const option = document.createElement('option');
                option.value = w.id;
                option.textContent = w.name;
                select.appendChild(option);
            });
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('trxCategory');
            if (!select) return;

            select.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            
            const categories = [
                'Salary', 'Freelance', 'Investment', 'Bonus', 'Other Income',
                'Food & Drink', 'Transport', 'Shopping', 'Bills', 'Rent', 
                'Entertainment', 'Health', 'Education', 'Other Expense'
            ];
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        async function submitTransaction(e) {
            e.preventDefault();
            
            const walletId = document.getElementById('trxWallet').value;
            const type = document.querySelector('input[name="type"]:checked').value;
            const category = document.getElementById('trxCategory').value;
            const amount = parseFloat(document.getElementById('trxAmount').value);
            const date = document.getElementById('trxDate').value;
            const notes = document.getElementById('trxNotes').value || null;
            const proofFile = document.getElementById('trxProof').files[0];

            if (!walletId || !category || !amount || !date) {
                alert('Mohon lengkapi semua field wajib!');
                return;
            }

            let attachment_url = null;

            // Upload proof if exists
            if (proofFile) {
                const fileName = `${Date.now()}_${proofFile.name}`;
                const { data: uploadData, error: uploadError } = await db.storage
                    .from('proofs')
                    .upload(fileName, proofFile);

                if (uploadError) {
                    alert('Gagal upload bukti: ' + uploadError.message);
                    return;
                }

                const { data: urlData } = db.storage.from('proofs').getPublicUrl(fileName);
                attachment_url = urlData.publicUrl;
            }

            // Insert transaction
            const { error: insertError } = await db.from('transactions').insert({
                wallet_id: walletId,
                type: type,
                category: category,
                amount: amount,
                transaction_date: date,
                notes: notes,
                attachment_url: attachment_url
            });

            if (insertError) {
                alert('Gagal menyimpan transaksi: ' + insertError.message);
                return;
            }

            // Update wallet balance
            const wallet = myWallets.find(w => w.id === walletId);
            if (wallet) {
                const newBalance = type === 'income' 
                    ? parseFloat(wallet.balance) + amount 
                    : parseFloat(wallet.balance) - amount;

                await db.from('wallets')
                    .update({ balance: newBalance })
                    .eq('id', walletId);
            }

            closeAddTransactionModal();
            await initData(); // Refresh semua data
            alert('Transaksi berhasil disimpan!');
        }

        function openAddWalletModal() { 
            alert('Fitur Add Wallet akan segera hadir (bisa langsung tambah via Supabase untuk sekarang)'); 
        }
        
        function exportData(type) { 
            alert('Exporting as ' + type + ' (demo)'); 
            document.getElementById('exportModal').classList.remove('active'); 
        }

        // ==================== START APP ====================
        window.onload = function() {
            initialize();
        };
    </script>
</body>
</html>
